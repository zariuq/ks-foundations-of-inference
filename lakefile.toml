name = "ks-foundations-of-inference-lean"
version = "0.1.0"
releaseRepo = "https://github.com/zariuq/ks-foundations-of-inference"
preferReleaseBuild = true
defaultTargets = ["KnuthSkilling"]

# Maintained foundation modules and generic interpretations. Application bridges
# live in MeTTapedia; undeclared legacy trees are outside the supported build.
[[lean_lib]]
name = "KnuthSkilling"
globs = [
  "KnuthSkilling",
  "KnuthSkilling.Api",
  "KnuthSkilling.AppendixA",
  "KnuthSkilling.Core",
  "KnuthSkilling.Counterexamples",
  "KnuthSkilling.FoundationsOfInference",
  "KnuthSkilling.Literature",
  "KnuthSkilling.Multiplicative",
  "KnuthSkilling.Overview",
  "KnuthSkilling.ShoreJohnson",
  "KnuthSkilling.Additive.+",
  "KnuthSkilling.Core.+",
  "KnuthSkilling.Counterexamples.+",
  "KnuthSkilling.Examples.+",
  "KnuthSkilling.Experimental.+",
  "KnuthSkilling.Heyting.+",
  "KnuthSkilling.Information.+",
  "KnuthSkilling.Literature.+",
  "KnuthSkilling.Multiplicative.+",
  "KnuthSkilling.Probability.+",
  "KnuthSkilling.ShoreJohnson.+",
  "KnuthSkilling.Variational.+",
  "KnuthSkilling.Bridges.GoertzelGroupFix",
  "KnuthSkilling.Bridges.MathlibBridge",
  "KnuthSkilling.Bridges.MathlibProbability",
  "KnuthSkilling.Bridges.Model",
  "KnuthSkilling.Bridges.ShoreJohnsonVariationalBridge",
]

[[lean_lib]]
name = "Algebra"
globs = ["Algebra.SplitComplex", "Algebra.TwoDimClassification",
  "Algebra.QuadraticPresentation", "Algebra.QuadraticPolynomialPresentation"]

[[lean_lib]]
name = "InformationTheory"
globs = ["InformationTheory.Basic", "InformationTheory.ShannonEntropy.Equivalence",
  "InformationTheory.ShannonEntropy.Faddeev", "InformationTheory.ShannonEntropy.Properties",
  "InformationTheory.ShannonEntropy.ShannonKhinchin"]

[[lean_lib]]
name = "ProbabilityTheory"
globs = ["ProbabilityTheory.Cox", "ProbabilityTheory.Cox.+", "ProbabilityTheory.Common.Lattice",
  "ProbabilityTheory.Foundations.Distributions.ProbDist", "ProbabilityTheory.Structures.Valuation.Basic",
  "ProbabilityTheory.Hypercube.Precision"]

[[require]]
name = "ordered_semigroups"
git = "https://github.com/zariuq/OrderedSemigroups.git"
rev = "dd82826dfce02bedabbad75734e4f055939369f6"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"
